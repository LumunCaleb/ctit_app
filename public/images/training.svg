.trn-prog{transform-box:fill-box;transform-origin:left center;animation:trn-prog 5s ease-in-out infinite}
@keyframes trn-prog{0%{transform:scaleX(.2)}70%,100%{transform:scaleX(1)}}
.trn-arm{transform-box:view-box;transform-origin:722px 236px;animation:trn-arm 4s ease-in-out infinite}
@keyframes trn-arm{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.trn-dash{stroke-dasharray:6 8;animation:trn-dash 1.4s linear infinite}
@keyframes trn-dash{to{stroke-dashoffset:-28}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
