<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="ws-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<pattern id="ws-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<radialGradient id="ws-go"><stop offset="0" stop-color="#f7841a" stop-opacity="0.25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<radialGradient id="ws-gb"><stop offset="0" stop-color="#5b8af9" stop-opacity="0.2"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<radialGradient id="ws-scrglow"><stop offset="0" stop-color="#5b8af9" stop-opacity="0.45"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<linearGradient id="ws-cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.22"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
<linearGradient id="ws-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#fb9a3c"/></linearGradient>
<linearGradient id="ws-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#dbe6fe"/></linearGradient>
<clipPath id="ws-scope"><rect x="54" y="274" width="92" height="66" rx="4"/></clipPath>
<filter id="ws-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050b1f" flood-opacity="0.5"/></filter>
</defs>
<style>
.ws-wave{animation:ws-wave 1.2s linear infinite}
@keyframes ws-wave{to{transform:translateX(-30px)}}
.ws-head{animation:ws-head 3.2s ease-in-out infinite alternate}
@keyframes ws-head{from{transform:translateX(-22px)}to{transform:translateX(30px)}}
.ws-glow{animation:ws-glow 3s ease-in-out infinite}
@keyframes ws-glow{0%,100%{opacity:.55}50%{opacity:1}}
.ws-led{animation:ws-led 1.4s ease-in-out infinite}
.ws-l2{animation-delay:.5s}.ws-l3{animation-delay:.9s}
@keyframes ws-led{0%,100%{opacity:1}50%{opacity:.2}}
.ws-smoke{animation:ws-smoke 3s ease-out infinite}
.ws-s2{animation-delay:1.5s}
@keyframes ws-smoke{0%{transform:translateY(6px);opacity:0}30%{opacity:.7}100%{transform:translateY(-18px);opacity:0}}
.ws-cur{animation:ws-cur 1s steps(2,start) infinite}
@keyframes ws-cur{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
