<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="eng-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<pattern id="eng-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/></pattern>
<radialGradient id="eng-go"><stop offset="0" stop-color="#f7841a" stop-opacity=".25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<radialGradient id="eng-gb"><stop offset="0" stop-color="#5b8af9" stop-opacity=".2"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<filter id="eng-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/></filter>

<radialGradient id="eng-sun"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f7841a"/></radialGradient>
<radialGradient id="eng-sung"><stop offset="0" stop-color="#fb9a3c" stop-opacity=".55"/><stop offset="1" stop-color="#fb9a3c" stop-opacity="0"/></radialGradient>
<linearGradient id="eng-front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#dbe6fe"/></linearGradient>
<linearGradient id="eng-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93b4fd"/><stop offset="1" stop-color="#5b8af9"/></linearGradient>
<linearGradient id="eng-pv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3563ea"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<linearGradient id="eng-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3480"/><stop offset="1" stop-color="#0b1838"/></linearGradient>
<linearGradient id="eng-cone" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#93b4fd" stop-opacity=".45"/><stop offset="1" stop-color="#93b4fd" stop-opacity="0"/></linearGradient>
