<style>
.eng-a{transform-box:fill-box;transform-origin:center}

.eng-rays{transform-box:view-box;transform-origin:130px 120px;animation:eng-rot 8s linear infinite}
@keyframes eng-rot{to{transform:rotate(30deg)}}
.eng-flow{stroke-dasharray:8 10;animation:eng-flow 1s linear infinite}
@keyframes eng-flow{to{stroke-dashoffset:-18}}
.eng-beam{stroke-dasharray:4 14;animation:eng-flow2 1.6s linear infinite}
@keyframes eng-flow2{to{stroke-dashoffset:-36}}
.eng-lvl{transform-box:fill-box;transform-origin:center bottom;animation:eng-lvl 4s ease-in-out infinite}
@keyframes eng-lvl{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.eng-pulse{animation:eng-pulse 2s ease-in-out infinite}
@keyframes eng-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.eng-cam{transform-box:view-box;transform-origin:684px 232px;animation:eng-pan 7s ease-in-out infinite}
@keyframes eng-pan{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
.eng-cloud{animation:eng-drift 8s ease-in-out infinite}
@keyframes eng-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.eng-shine{animation:eng-shine 4s ease-in-out infinite}
@keyframes eng-shine{0%,100%{opacity:.15}50%{opacity:.55}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
