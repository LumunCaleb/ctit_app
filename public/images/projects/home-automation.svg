<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="ha-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<pattern id="ha-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<radialGradient id="ha-go"><stop offset="0" stop-color="#f7841a" stop-opacity="0.25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<radialGradient id="ha-gb"><stop offset="0" stop-color="#5b8af9" stop-opacity="0.2"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<linearGradient id="ha-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24428f"/><stop offset="1" stop-color="#1a3480"/></linearGradient>
<linearGradient id="ha-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb9a3c"/><stop offset="1" stop-color="#f7841a"/></linearGradient>
<linearGradient id="ha-cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
<radialGradient id="ha-halo"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<linearGradient id="ha-scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3480"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<linearGradient id="ha-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#1a3480"/></linearGradient>
<linearGradient id="ha-sofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8af9"/><stop offset="1" stop-color="#3563ea"/></linearGradient>
<filter id="ha-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050b1f" flood-opacity="0.55"/></filter>
</defs>
<style>
.ha-glow{animation:ha-light 8s ease-in-out infinite}
@keyframes ha-light{0%,42%{opacity:1}50%,92%{opacity:.06}100%{opacity:1}}
.ha-dark{animation:ha-dim 8s ease-in-out infinite}
@keyframes ha-dim{0%,42%{opacity:0}50%,92%{opacity:.35}100%{opacity:0}}
.ha-fan{transform-box:fill-box;transform-origin:center;animation:ha-spin .7s linear infinite}
@keyframes ha-spin{to{transform:rotate(360deg)}}
.ha-arc{animation:ha-pulse 2.4s ease-out infinite}
.ha-a2{animation-delay:.4s}.ha-a3{animation-delay:.8s}
@keyframes ha-pulse{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.ha-flow{stroke-dasharray:4 8;animation:ha-dash 1.4s linear infinite}
@keyframes ha-dash{to{stroke-dashoffset:-24}}
.ha-knob{transform-box:fill-box;transform-origin:center;animation:ha-knob 8s ease-in-out infinite}
@keyframes ha-knob{0%,42%{transform:translateX(0)}50%,92%{transform:translateX(-11px)}100%{transform:translateX(0)}}
.ha-tog{animation:ha-tog 8s ease-in-out infinite}
@keyframes ha-tog{0%,42%{fill:#22a04b}50%,92%{fill:#64748b}100%{fill:#22a04b}}
.ha-blink{animation:ha-blink 1.6s ease-in-out infinite}
.ha-b2{animation-delay:.6s}
@keyframes ha-blink{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
