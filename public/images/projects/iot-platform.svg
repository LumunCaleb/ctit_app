<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="iot-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<pattern id="iot-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<radialGradient id="iot-go"><stop offset="0" stop-color="#f7841a" stop-opacity="0.25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<radialGradient id="iot-gb"><stop offset="0" stop-color="#5b8af9" stop-opacity="0.2"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<linearGradient id="iot-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#dbe6fe"/></linearGradient>
<linearGradient id="iot-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7841a" stop-opacity="0.35"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></linearGradient>
<linearGradient id="iot-pv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8af9"/><stop offset="1" stop-color="#1a3480"/></linearGradient>
<clipPath id="iot-clip"><rect x="262" y="118" width="508" height="422" rx="14"/></clipPath>
<filter id="iot-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050b1f" flood-opacity="0.55"/></filter>
</defs>
<style>
.iot-flow{stroke-dasharray:6 10;animation:iot-dash 1.2s linear infinite}
@keyframes iot-dash{to{stroke-dashoffset:-32}}
.iot-pulse{transform-box:fill-box;transform-origin:center;animation:iot-pulse 2.4s ease-out infinite}
.iot-p2{animation-delay:.6s}.iot-p3{animation-delay:1.2s}.iot-p4{animation-delay:1.8s}
@keyframes iot-pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(3);opacity:0}}
.iot-bar{transform-box:fill-box;transform-origin:50% 100%;animation:iot-grow 3s ease-in-out infinite alternate}
.iot-b2{animation-delay:.3s}.iot-b3{animation-delay:.6s}.iot-b4{animation-delay:.9s}.iot-b5{animation-delay:1.2s}.iot-b6{animation-delay:1.5s}.iot-b7{animation-delay:1.8s}
@keyframes iot-grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.iot-line{stroke-dasharray:200;animation:iot-draw 5s ease-in-out infinite}
@keyframes iot-draw{0%{stroke-dashoffset:200}50%,100%{stroke-dashoffset:0}}
.iot-blink{animation:iot-blink 1.6s ease-in-out infinite}
.iot-k2{animation-delay:.5s}.iot-k3{animation-delay:1s}
@keyframes iot-blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
