<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="solm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<pattern id="solm-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<radialGradient id="solm-go"><stop offset="0" stop-color="#f7841a" stop-opacity="0.25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<radialGradient id="solm-gb"><stop offset="0" stop-color="#5b8af9" stop-opacity="0.2"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<linearGradient id="solm-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#dbe6fe"/></linearGradient>
<linearGradient id="solm-pv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3563ea"/><stop offset="1" stop-color="#1a3480"/></linearGradient>
<filter id="solm-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050b1f" flood-opacity="0.55"/></filter>
<radialGradient id="solm-sun"><stop offset="0" stop-color="#fbbf24" stop-opacity=".7"/><stop offset=".5" stop-color="#f7841a" stop-opacity=".25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<linearGradient id="solm-disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f7841a"/></linearGradient>
<linearGradient id="solm-gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3480"/><stop offset="1" stop-color="#0b1838"/></linearGradient>
<linearGradient id="solm-ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7841a" stop-opacity=".35"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></linearGradient>
</defs>
<style>

.solm-glow{transform-box:fill-box;transform-origin:center;animation:solm-glow 4s ease-in-out infinite}
@keyframes solm-glow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.15);opacity:1}}
.solm-rays{transform-box:fill-box;transform-origin:center;animation:solm-spin 24s linear infinite}
@keyframes solm-spin{to{transform:rotate(360deg)}}
.solm-flow{animation:solm-dash 1.4s linear infinite}
@keyframes solm-dash{to{stroke-dashoffset:-32}}
.solm-wave{animation:solm-pulse 2.4s ease-in-out infinite}
.solm-w2{animation-delay:.4s}.solm-w3{animation-delay:.8s}
@keyframes solm-pulse{0%,100%{opacity:.15}40%{opacity:1}}
.solm-curve{animation:solm-draw 6s ease-in-out infinite}
@keyframes solm-draw{0%{stroke-dashoffset:100}50%,100%{stroke-dashoffset:0}}
.solm-area{animation:solm-fade 6s ease-in-out infinite}
@keyframes solm-fade{0%,10%{opacity:0}50%,100%{opacity:1}}
.solm-bat{transform-box:fill-box;transform-origin:0 50%;animation:solm-charge 5s ease-in-out infinite}
@keyframes solm-charge{0%{transform:scaleX(.35)}70%,100%{transform:scaleX(1)}}
.solm-card{animation:solm-float 7s ease-in-out infinite}
@keyframes solm-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.solm-glint{animation:solm-glint 5s ease-in-out infinite}
@keyframes solm-glint{0%,100%{opacity:.05}50%{opacity:.22}}
.solm-blink{animation:solm-blink 1.4s ease-in-out infinite}
@keyframes solm-blink{0%,100%{opacity:1}50%{opacity:.2}}
.solm-cloud{animation:solm-drift 14s ease-in-out infinite}
@keyframes solm-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
