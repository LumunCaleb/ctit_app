<rect x="530" y="132" width="40" height="52" fill="#3563ea"/><rect x="574" y="146" width="36" height="38" fill="#142a63"/>
<g fill="#fdba74"><rect x="537" y="140" width="8" height="8"/><rect x="553" y="140" width="8" height="8"/><rect x="553" y="156" width="8" height="8"/><rect x="582" y="154" width="7" height="7"/></g>
