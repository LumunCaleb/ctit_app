<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="cctv-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<pattern id="cctv-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<radialGradient id="cctv-go"><stop offset="0" stop-color="#f7841a" stop-opacity="0.25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<radialGradient id="cctv-gb"><stop offset="0" stop-color="#5b8af9" stop-opacity="0.2"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<radialGradient id="cctv-lamp"><stop offset="0" stop-color="#fdba74" stop-opacity="0.55"/><stop offset="1" stop-color="#fdba74" stop-opacity="0"/></radialGradient>
<linearGradient id="cctv-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24428f"/><stop offset="1" stop-color="#1a3480"/></linearGradient>
<linearGradient id="cctv-win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f7841a"/></linearGradient>
<linearGradient id="cctv-cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93b4fd" stop-opacity="0.4"/><stop offset="1" stop-color="#93b4fd" stop-opacity="0"/></linearGradient>
<linearGradient id="cctv-cone2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#93b4fd" stop-opacity="0.4"/><stop offset="1" stop-color="#93b4fd" stop-opacity="0"/></linearGradient>
<linearGradient id="cctv-scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93b4fd" stop-opacity="0"/><stop offset="1" stop-color="#93b4fd" stop-opacity="0.35"/></linearGradient>
<pattern id="cctv-razor" width="20" height="16" patternUnits="userSpaceOnUse"><path d="M0 14L10 3L20 14" fill="none" stroke="#64748b" stroke-width="1.5"/><circle cx="10" cy="3" r="1.5" fill="#93b4fd"/></pattern>
<filter id="cctv-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050b1f" flood-opacity="0.55"/></filter>
</defs>
<style>
.cctv-pan1{transform-box:fill-box;transform-origin:50% 0;animation:cctv-pan1 7s ease-in-out infinite alternate}
@keyframes cctv-pan1{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.cctv-lens{transform-box:fill-box;transform-origin:center;animation:cctv-lens 7s ease-in-out infinite alternate}
@keyframes cctv-lens{from{transform:translateX(5px)}to{transform:translateX(-5px)}}
.cctv-pan2{transform-box:view-box;transform-origin:108px 214px;animation:cctv-pan2 6s ease-in-out infinite alternate}
@keyframes cctv-pan2{from{transform:rotate(-34deg)}to{transform:rotate(-10deg)}}
.cctv-rec{animation:cctv-blink 1.2s steps(2,start) infinite}
.cctv-r2{animation-delay:.3s}.cctv-r3{animation-delay:.6s}.cctv-r4{animation-delay:.9s}
@keyframes cctv-blink{0%,100%{opacity:1}50%{opacity:.15}}
.cctv-scanline{animation:cctv-scan 4s linear infinite}
@keyframes cctv-scan{from{transform:translateY(0)}to{transform:translateY(152px)}}
.cctv-flow{stroke-dasharray:3 9;animation:cctv-dash 1.2s linear infinite}
@keyframes cctv-dash{to{stroke-dashoffset:-24}}
.cctv-led{animation:cctv-led 1.6s ease-in-out infinite}
.cctv-l2{animation-delay:.7s}
@keyframes cctv-led{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="800" height="600" fill="url(#cctv-bg)"/>
<rect width="800" height="600" fill="url(#cctv-grid)"/>
<circle cx="150" cy="470" r="360" fill="url(#cctv-go)"/>
<circle cx="660" cy="120" r="300" fill="url(#cctv-gb)"/>
<circle cx="232" cy="64" r="44" fill="url(#cctv-lamp)" opacity="0.6"/>
<circle cx="232" cy="64" r="16" fill="#fdba74"/><circle cx="238" cy="58" r="14" fill="#142a63" opacity="0.35"/>
<g fill="#dbe6fe" opacity="0.6"><circle cx="60" cy="50" r="1.5"/><circle cx="140" cy="96" r="1.2"/><circle cx="360" cy="40" r="1.5"/><circle cx="440" cy="84" r="1.2"/><circle cx="560" cy="40" r="1.4"/><circle cx="780" cy="60" r="1.2"/></g>
<!-- ground -->
<rect y="500" width="800" height="100" fill="#0b1838" opacity="0.6"/>
<rect y="500" width="800" height="18" fill="#1a3480"/><rect y="518" width="800" height="4" fill="#334155"/>
