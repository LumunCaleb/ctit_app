<path d="M110 214H122V158H462V372H496" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round"/>
<path d="M110 214H122V158H462V372H496" fill="none" stroke="#5b8af9" stroke-width="2" class="cctv-flow"/>
<g fill="#64748b"><rect x="196" y="153" width="6" height="10" rx="1"/><rect x="300" y="153" width="6" height="10" rx="1"/><rect x="457" y="240" width="10" height="6" rx="1"/><rect x="457" y="320" width="10" height="6" rx="1"/></g>
<!-- dome camera -->
<polygon points="420,164 348,432 492,432" fill="url(#cctv-cone)" class="cctv-pan1"/>
<rect x="404" y="150" width="32" height="8" rx="2" fill="#dbe6fe"/>
<path d="M406 158A14 14 0 0 0 434 158Z" fill="#f1f5f9" stroke="#93b4fd" stroke-width="1.5"/>
<g class="cctv-lens"><circle cx="420" cy="164" r="5" fill="#0b1838"/><circle cx="421.5" cy="162.5" r="1.5" fill="#93b4fd"/></g>
<circle cx="430" cy="154" r="1.8" fill="#ef4444" class="cctv-rec"/>
<!-- bullet camera -->
<rect x="120" y="204" width="6" height="20" rx="1" fill="#dbe6fe"/>
<path d="M122 214H106" stroke="#dbe6fe" stroke-width="5" stroke-linecap="round"/>
<g class="cctv-pan2">
<polygon points="56,214 -240,124 -240,304" fill="url(#cctv-cone2)"/>
<rect x="52" y="199" width="58" height="8" rx="3" fill="#dbe6fe"/>
<rect x="56" y="205" width="52" height="18" rx="6" fill="#f1f5f9" stroke="#93b4fd" stroke-width="1.5"/>
<rect x="54" y="207" width="8" height="14" rx="2" fill="#0b1838"/>
<circle cx="98" cy="214" r="1.8" fill="#ef4444" class="cctv-rec cctv-r2"/>
</g>
<!-- compound wall with razor wire -->
<rect y="376" width="488" height="16" fill="url(#cctv-razor)"/>
<rect y="392" width="488" height="10" fill="#64748b"/>
