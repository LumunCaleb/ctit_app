<rect x="692" y="236" width="60" height="26" fill="#334155"/><path d="M692 236l6 -6 6 6 6 -6 6 6 6 -6 6 6 6 -6 6 6 6 -6 6 6" fill="none" stroke="#64748b" stroke-width="1.5"/>
