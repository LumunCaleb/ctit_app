<rect x="245" y="266" width="76" height="58" rx="4" fill="#0b1838"/>
<rect x="340" y="266" width="76" height="58" rx="4" fill="url(#cctv-win)"/>
<path d="M188 180V238M283 180V238M378 180V238M188 266V324M283 266V324M378 266V324" fill="none"/>
</g>
<path d="M254 196l14 -10M254 282l14 -10M159 282l14 -10" stroke="#5b8af9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
