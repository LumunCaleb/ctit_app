<path d="M0 562H800" stroke="#64748b" stroke-width="3" stroke-dasharray="30 20" opacity="0.4"/>
<g fill="#22a04b" opacity="0.8"><path d="M540 500q4 -12 8 0q4 -14 8 0q4 -10 8 0z"/><path d="M640 500q4 -12 8 0q4 -14 8 0z"/><path d="M720 500q4 -12 8 0q4 -14 8 0q4 -10 8 0z"/></g>
<!-- building -->
<g filter="url(#cctv-sh)">
<polygon points="450,148 474,136 474,398 450,412" fill="#142a63"/>
<rect x="120" y="148" width="330" height="264" fill="url(#cctv-wall)"/>
<rect x="110" y="130" width="350" height="18" rx="3" fill="#334155"/>
<polygon points="460,130 482,120 482,136 460,148" fill="#1e293b"/>
</g>
<g stroke="#93b4fd" stroke-width="2">
<rect x="150" y="180" width="76" height="58" rx="4" fill="url(#cctv-win)"/>
<rect x="245" y="180" width="76" height="58" rx="4" fill="#0b1838"/>
<rect x="340" y="180" width="76" height="58" rx="4" fill="url(#cctv-win)"/>
