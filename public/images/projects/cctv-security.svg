<rect x="494" y="350" width="96" height="30" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
<circle cx="506" cy="365" r="2.5" fill="#4ade80" class="cctv-led"/><circle cx="516" cy="365" r="2.5" fill="#5b8af9"/><circle cx="526" cy="365" r="2.5" fill="#f7841a" class="cctv-led cctv-l2"/>
<path d="M544 358V372M550 358V372M556 358V372M562 358V372M568 358V372M574 358V372" stroke="#0b1838" stroke-width="2"/>
<path d="M590 366Q612 366 628 336" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="690" y="370" width="70" height="10" rx="3" fill="#334155"/>
<path d="M696 375H754" stroke="#64748b" stroke-width="3" stroke-dasharray="4 2"/>
<ellipse cx="774" cy="375" rx="6" ry="4" fill="#334155"/>
<!-- monitor -->
<rect x="626" y="290" width="18" height="84" fill="#334155"/>
<rect x="596" y="372" width="78" height="8" rx="4" fill="#64748b"/>
<g filter="url(#cctv-sh)"><rect x="496" y="92" width="278" height="202" rx="12" fill="#0b1838" stroke="#5b8af9" stroke-width="2"/></g>
