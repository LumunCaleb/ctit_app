<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="farm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1838"/><stop offset="1" stop-color="#142a63"/></linearGradient>
<pattern id="farm-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/></pattern>
<radialGradient id="farm-go"><stop offset="0" stop-color="#f7841a" stop-opacity="0.25"/><stop offset="1" stop-color="#f7841a" stop-opacity="0"/></radialGradient>
<radialGradient id="farm-gb"><stop offset="0" stop-color="#5b8af9" stop-opacity="0.2"/><stop offset="1" stop-color="#5b8af9" stop-opacity="0"/></radialGradient>
<linearGradient id="farm-shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#dbe6fe"/></linearGradient>
<linearGradient id="farm-pv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3563ea"/><stop offset="1" stop-color="#1a3480"/></linearGradient>
<filter id="farm-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050b1f" flood-opacity="0.55"/></filter>
<linearGradient id="farm-gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3480"/><stop offset="1" stop-color="#0b1838"/></linearGradient>
<g id="farm-plant"><path d="M0 0V-44" stroke="#22a04b" stroke-width="3" stroke-linecap="round"/><path d="M0-10C-16-12-26-26-26-36C-12-32-3-24 0-10Z" fill="#22a04b"/><path d="M0-20C16-22 26-36 24-46C10-42 2-34 0-20Z" fill="#4ade80"/><path d="M0-34C-8-40-8-54 0-62C8-54 8-40 0-34Z" fill="#4ade80"/></g>
</defs>
<style>

.farm-sway{transform-box:fill-box;transform-origin:50% 100%;animation:farm-sway 4s ease-in-out infinite}
@keyframes farm-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.farm-wave{animation:farm-pulse 2.4s ease-in-out infinite}
.farm-w2{animation-delay:.35s}.farm-w3{animation-delay:.7s}.farm-w4{animation-delay:1.05s}
@keyframes farm-pulse{0%,100%{opacity:.1}40%{opacity:1}}
.farm-drop{animation:farm-fall 1.8s ease-in infinite}
@keyframes farm-fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.farm-link{animation:farm-dash 1.6s linear infinite}
@keyframes farm-dash{to{stroke-dashoffset:-24}}
.farm-blink{animation:farm-blink 1.4s ease-in-out infinite}
@keyframes farm-blink{0%,100%{opacity:1}50%{opacity:.2}}
.farm-ripple{transform-box:fill-box;transform-origin:center;animation:farm-rip 2.6s ease-out infinite}
@keyframes farm-rip{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.farm-card{animation:farm-float 6s ease-in-out infinite}
@keyframes farm-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.farm-fill{transform-box:fill-box;transform-origin:0 50%;animation:farm-grow 5s ease-in-out infinite}
@keyframes farm-grow{0%,100%{transform:scaleX(.55)}60%{transform:scaleX(1)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
