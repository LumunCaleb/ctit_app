.sw-float{animation:sw-float 6s ease-in-out infinite}
@keyframes sw-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sw-bar{transform-box:fill-box;transform-origin:center bottom;animation:sw-bar 3s ease-in-out infinite}
